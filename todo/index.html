<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FocusList — a simple task manager built with semantic HTML, CSS and JavaScript.">
  <meta name="theme-color" content="#0b1220"><title>FocusList | Shivam Singh</title>
  <link rel="stylesheet" href="css/styles.css"><script src="js/app.js" defer></script>
</head>
<body>
  <main class="app">
    <div class="top"><a class="brand" href="../index.html">← <strong>Shivam Singh</strong> / Portfolio</a><button class="theme" id="theme-toggle" type="button">☀ Light mode</button></div>
    <h1>Make room for <span style="color:var(--accent)">focus.</span></h1>
    <p class="subtitle">A small, calm space to capture what needs to get done.</p>
    <section class="panel" aria-label="Task manager">
      <form class="entry" id="task-form">
        <label for="task-input" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">New task</label>
        <input id="task-input" type="text" maxlength="180" placeholder="What needs your attention?" autocomplete="off" required>
        <button class="primary" type="submit">Add task</button>
      </form>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <button class="clear" id="clear-completed" type="button" hidden>Clear completed</button>
      </div>
      <p id="task-count" style="color:var(--muted);font-size:13px" aria-live="polite"></p>
      <ul class="list" id="task-list" aria-label="Your tasks"></ul>
      <p class="empty" id="empty-state">No tasks here yet. Add one above to get started.</p>
    </section>
    <p class="footer">Tasks are saved in this browser using localStorage. <a class="back" href="../projects.html">Back to projects</a></p>
  </main>
</body></html>
